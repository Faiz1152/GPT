<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ParentGPT</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #343541;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #202123;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    #chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user {
      background-color: #4e8cff;
      align-self: flex-end;
    }

    .bot {
      background-color: #444654;
      align-self: flex-start;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background-color: #202123;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      background-color: #4e8cff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3a6fd8;
    }
  </style>
</head>
<body>

<header>ParentGPT</header>

<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="userInput" placeholder="Ask something...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  function sendMessage() {
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (text === "") return;

    // User message
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chat.appendChild(userMsg);

    // Bot response
    const botMsg = document.createElement("div");
    botMsg.className = "message bot";
    botMsg.textContent = "Correct! " + text;
    chat.appendChild(botMsg);

    input.value = "";
    chat.scrollTop = chat.scrollHeight;
  }

  // Enter key support
  document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
